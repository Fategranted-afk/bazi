<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="70%" stop-color="#0e111a" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" />

  <!-- Outer Celestial Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,8" opacity="0.4" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Bagua Trigram Notches (8 directions) -->
  <g stroke="url(#goldGrad)" stroke-width="3" opacity="0.75" stroke-linecap="round">
    <!-- Qian (South/Top) 3 solid lines -->
    <line x1="236" y1="72" x2="276" y2="72" />
    <line x1="236" y1="80" x2="276" y2="80" />
    <line x1="236" y1="88" x2="276" y2="88" />

    <!-- Kun (North/Bottom) 3 broken lines -->
    <line x1="236" y1="424" x2="252" y2="424" /><line x1="260" y1="424" x2="276" y2="424" />
    <line x1="236" y1="432" x2="252" y2="432" /><line x1="260" y1="432" x2="276" y2="432" />
    <line x1="236" y1="440" x2="252" y2="440" /><line x1="260" y1="440" x2="276" y2="440" />

    <!-- Kan (West/Left) -->
    <line x1="72" y1="246" x2="88" y2="246" /><line x1="96" y1="246" x2="112" y2="246" />
    <line x1="72" y1="256" x2="112" y2="256" />
    <line x1="72" y1="266" x2="88" y2="266" /><line x1="96" y1="266" x2="112" y2="266" />

    <!-- Li (East/Right) -->
    <line x1="400" y1="246" x2="440" y2="246" />
    <line x1="400" y1="256" x2="416" y2="256" /><line x1="424" y1="256" x2="440" y2="256" />
    <line x1="400" y1="266" x2="440" y2="266" />
  </g>

  <!-- Central Dial Background -->
  <circle cx="256" cy="256" r="144" fill="#141722" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Yin-Yang Taiji Symbol -->
  <g transform="translate(256, 256)">
    <!-- Dark Half (Yin) -->
    <path d="M 0,-110 A 110,110 0 0,0 0,110 A 55,55 0 0,1 0,0 A 55,55 0 0,0 0,-110 Z" fill="#090b10" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Light Half (Yang) -->
    <path d="M 0,-110 A 110,110 0 0,1 0,110 A 55,55 0 0,1 0,0 A 55,55 0 0,0 0,-110 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Small Eyes -->
    <circle cx="0" cy="-55" r="15" fill="url(#goldGrad)" />
    <circle cx="0" cy="55" r="15" fill="#090b10" />
  </g>

  <!-- Imperial Red Vermilion Seal in Bottom Right Corner -->
  <g transform="translate(372, 372)">
    <rect width="84" height="84" rx="12" fill="url(#sealGrad)" stroke="#fef08a" stroke-width="2" />
    <text x="42" y="36" font-family="'Songti SC', 'Noto Serif SC', serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">天机</text>
    <text x="42" y="66" font-family="'Songti SC', 'Noto Serif SC', serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">御制</text>
  </g>
</svg>
